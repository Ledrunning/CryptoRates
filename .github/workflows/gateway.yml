name: gateway

on:
  push:
    branches: [master]
    paths:
      - 'src/CryptoRates.Gateway/**'
      - 'src/CryptoRates.Services/**'
      - 'src/CryptoRates.Common/**'
      - 'src/CryptoRates.Tests/**'
      - '.github/workflows/gateway.yml'
  pull_request:
    branches: [master]
    paths:
      - 'src/CryptoRates.Gateway/**'
      - 'src/CryptoRates.Services/**'
      - 'src/CryptoRates.Common/**'
      - 'src/CryptoRates.Tests/**'
      - '.github/workflows/gateway.yml'

permissions:
  contents: read

concurrency:
  group: gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/CryptoRates.Tests/CryptoRates.Tests.csproj

      - name: Build
        run: dotnet build src/CryptoRates.Tests/CryptoRates.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test src/CryptoRates.Tests/CryptoRates.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/test-results.trx"
