name: web

on:
  push:
    branches: [master]
    paths:
      - 'src/CryptoRates.Web/**'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [master]
    paths:
      - 'src/CryptoRates.Web/**'
      - '.github/workflows/web.yml'

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/CryptoRates.Web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/CryptoRates.Web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
