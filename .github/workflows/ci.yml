name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    name: Gateway and tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/CryptoRates.Tests/CryptoRates.Tests.csproj

      - name: Build
        run: dotnet build src/CryptoRates.Tests/CryptoRates.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test src/CryptoRates.Tests/CryptoRates.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/test-results.trx"

  desktop:
    name: WPF client (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build src/CryptoRates.Client/CryptoRates.Client.csproj -c Release

  web:
    name: Web client (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/CryptoRates.Web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/CryptoRates.Web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
